<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate LunchVote Pro - Mehrwochen-Speiseplan & Bestellsystem</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#004c42',
                            dark: '#00362f',
                            light: '#006659',
                            sage: '#829791',
                            sageLight: '#eef2f1',
                            accent: '#e07a5f'
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; }
            .shadow-lg, .shadow-md, .shadow-sm, .shadow-xl, .shadow-2xl { box-shadow: none !important; }
            .border { border-color: #cbd5e1 !important; }
        }
        .print-only { display: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #829791; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #004c42; }
    </style>
</head>
<body class="h-full text-slate-800 flex flex-col antialiased bg-slate-50" x-data="lunchVoteApp()" x-init="initApp()">

    <!-- Toast Notification -->
    <div x-show="toast.visible" 
         x-transition:enter="transition ease-out duration-300 transform"
         x-transition:enter-start="opacity-0 translate-y-[-20px]"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200 transform"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-[-20px]"
         class="fixed top-4 right-4 z-50 max-w-md p-4 rounded-xl shadow-xl flex items-center gap-3 text-white no-print"
         :class="{
             'bg-emerald-700': toast.type === 'success',
             'bg-rose-700': toast.type === 'error',
             'bg-amber-600': toast.type === 'warning',
             'bg-brand': toast.type === 'info'
         }"
         style="display: none;">
        <i class="text-xl" :class="{
            'fa-solid fa-circle-check': toast.type === 'success',
            'fa-solid fa-triangle-exclamation': toast.type === 'error',
            'fa-solid fa-circle-exclamation': toast.type === 'warning',
            'fa-solid fa-circle-info': toast.type === 'info'
        }"></i>
        <div class="flex-1 text-sm font-medium" x-text="toast.message"></div>
        <button @click="toast.visible = false" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Header -->
    <header class="bg-brand text-white shadow-md sticky top-0 z-40 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-brand-sage/20 border border-brand-sage/40 flex items-center justify-center text-emerald-300 font-bold text-xl shadow-inner">
                        <i class="fa-solid fa-utensils"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-none tracking-tight flex items-center gap-2">
                            Corporate LunchVote <span class="bg-brand-light text-white text-xs px-2 py-0.5 rounded-full font-bold uppercase border border-brand-sage/30">Enterprise Pro</span>
                        </h1>
                        <p class="text-xs text-brand-sage opacity-90 mt-0.5">Mehrwochen-Speiseplan & Bestellsystem</p>
                    </div>
                </div>

                <template x-if="currentUser">
                    <div class="flex items-center gap-3">
                        <div class="hidden md:flex items-center gap-2 text-xs bg-brand-dark/60 border border-brand-sage/30 px-3 py-1.5 rounded-lg">
                            <span class="w-2 h-2 rounded-full" :class="currentUser.role === 'admin' ? 'bg-amber-400' : 'bg-emerald-400'"></span>
                            <span class="text-slate-200">Konto:</span>
                            <strong class="text-white" x-text="currentUser.name"></strong>
                            <span class="text-[10px] px-1.5 py-0.5 rounded text-white font-bold uppercase"
                                  :class="currentUser.role === 'admin' ? 'bg-amber-600' : 'bg-emerald-600'"
                                  x-text="currentUser.role"></span>
                        </div>

                        <button @click="openProfileModal()" class="flex items-center gap-2 bg-brand-light hover:bg-brand-dark/60 px-3 py-1.5 rounded-xl border border-brand-sage/30 transition text-xs font-medium">
                            <i class="fa-solid fa-user-gear text-sm text-brand-sage"></i>
                            <span class="hidden sm:inline">Mein Profil</span>
                        </button>

                        <button @click="logout()" title="Abmelden" class="p-2 text-brand-sage hover:text-white transition">
                            <i class="fa-solid fa-right-from-bracket text-base"></i>
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- Login / Setup State -->
        <template x-if="!currentUser">
            <div class="max-w-md mx-auto my-12 bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                <div class="bg-brand p-6 text-white text-center">
                    <div class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center mx-auto mb-3 text-3xl text-emerald-300 border border-white/20">
                        <i class="fa-solid fa-utensils"></i>
                    </div>
                    <h2 class="text-2xl font-bold">Anmeldung</h2>
                    <p class="text-xs text-brand-sage mt-1">Corporate LunchVote Cloud Login</p>
                </div>

                <form @submit.prevent="login()" class="p-6 space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">E-Mail-Adresse</label>
                        <input type="email" x-model="loginForm.email" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand text-sm" placeholder="email@firma.de">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Passwort</label>
                        <input type="password" x-model="loginForm.password" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand text-sm" placeholder="••••••••">
                    </div>

                    <div x-show="loginError" class="p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg flex items-center gap-2" style="display: none;">
                        <i class="fa-solid fa-circle-exclamation text-base"></i>
                        <span x-text="loginError"></span>
                    </div>

                    <button type="submit" class="w-full py-2.5 bg-brand hover:bg-brand-dark text-white font-bold rounded-xl shadow-md transition text-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-right-to-bracket"></i> Anmelden
                    </button>
                </form>
            </div>
        </template>

        <!-- Authenticated App View -->
        <template x-if="currentUser">
            <div class="space-y-6">

                <!-- Navigation Control Bar -->
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4 no-print">
                    <div class="flex flex-wrap items-center gap-2 sm:gap-3">
                        <button @click="navigateWeek(-1)" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-xs flex items-center gap-1.5 transition">
                            <i class="fa-solid fa-chevron-left"></i>
                            <span class="hidden sm:inline">Vorherige Woche</span>
                        </button>

                        <button @click="jumpToToday()" class="px-3 py-2 bg-brand/10 hover:bg-brand/20 text-brand rounded-xl font-bold text-xs flex items-center gap-1.5 transition">
                            <i class="fa-solid fa-calendar-day"></i>
                            <span>Heute / Aktuelle KW</span>
                        </button>

                        <button @click="navigateWeek(1)" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-xs flex items-center gap-1.5 transition">
                            <span class="hidden sm:inline">Nächste Woche</span>
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>

                        <div class="relative flex items-center ml-auto sm:ml-2">
                            <span class="text-xs text-slate-400 mr-1.5 hidden md:inline">Springe zu:</span>
                            <input type="date" :value="selectedWeekMonday" @change="jumpToDate($event.target.value)" class="px-2.5 py-1.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold text-slate-700 focus:ring-2 focus:ring-brand">
                        </div>
                    </div>

                    <div class="flex flex-wrap items-center justify-between lg:justify-end gap-3 pt-3 lg:pt-0 border-t lg:border-t-0 border-slate-100">
                        <div class="flex items-center gap-2">
                            <div class="text-sm font-extrabold text-slate-900" x-text="getWeekDisplayTitle()"></div>
                            <span class="text-[11px] px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wider"
                                  :class="{
                                      'bg-slate-200 text-slate-700': getWeekStatus() === 'past',
                                      'bg-emerald-100 text-emerald-800 border border-emerald-300': getWeekStatus() === 'current',
                                      'bg-blue-100 text-blue-800 border border-blue-300': getWeekStatus() === 'future'
                                  }">
                                <span x-text="getWeekStatusText()"></span>
                            </span>
                        </div>

                        <div class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200 text-xs">
                            <i class="fa-solid fa-clock text-amber-600"></i>
                            <span class="text-slate-500 font-medium hidden sm:inline">Frist:</span>
                            <span class="font-mono font-bold" :class="isSelectedWeekDeadlinePassed() ? 'text-rose-600' : 'text-brand'" x-text="getDeadlineTextForSelectedWeek()"></span>
                        </div>
                    </div>
                </div>

                <!-- Admin Navigation Tabs -->
                <template x-if="currentUser.role === 'admin'">
                    <div class="bg-slate-200/60 p-1.5 rounded-xl flex flex-wrap gap-1 no-print">
                        <button @click="activeTab = 'menu'" 
                                :class="activeTab === 'menu' ? 'bg-white text-brand shadow-sm font-bold' : 'text-slate-600 hover:text-slate-900 font-medium'"
                                class="flex-1 min-w-[130px] py-2.5 text-xs sm:text-sm rounded-lg transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-utensils"></i> Speiseplan
                        </button>
                        <button @click="activeTab = 'users'" 
                                :class="activeTab === 'users' ? 'bg-white text-brand shadow-sm font-bold' : 'text-slate-600 hover:text-slate-900 font-medium'"
                                class="flex-1 min-w-[130px] py-2.5 text-xs sm:text-sm rounded-lg transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-users"></i> Mitarbeiter
                        </button>
                        <button @click="activeTab = 'reports'" 
                                :class="activeTab === 'reports' ? 'bg-white text-brand shadow-sm font-bold' : 'text-slate-600 hover:text-slate-900 font-medium'"
                                class="flex-1 min-w-[130px] py-2.5 text-xs sm:text-sm rounded-lg transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-chart-pie"></i> Auswertung & Küche
                        </button>
                    </div>
                </template>

                <!-- Menu View -->
                <div x-show="currentUser.role === 'user' || activeTab === 'menu'" class="space-y-6">

                    <!-- Days Grid -->
                    <div class="grid grid-cols-1 lg:grid-cols-5 gap-4">
                        <template x-for="day in getCurrentMenuPlan()" :key="day.id">
                            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col transition hover:shadow-md"
                                 :class="{ 'opacity-60 bg-slate-50': !day.active }">
                                
                                <div class="p-3 border-b border-slate-100 flex items-center justify-between"
                                     :class="isToday(day.date) ? 'bg-brand text-white' : 'bg-slate-100/70 text-slate-800'">
                                    <div>
                                        <div class="font-bold text-sm" x-text="day.dayName"></div>
                                        <div class="text-xs opacity-80" x-text="formatGermanDate(day.date)"></div>
                                    </div>
                                    <span x-show="isToday(day.date)" class="text-[10px] bg-amber-400 text-brand-dark px-1.5 py-0.5 rounded font-extrabold uppercase">Heute</span>
                                </div>

                                <div class="p-3 flex-1 space-y-3">
                                    <template x-if="!day.active">
                                        <div class="py-8 text-center text-xs text-slate-400 font-medium">
                                            <i class="fa-solid fa-ban text-2xl mb-1 block"></i>
                                            Keine Lieferung.
                                        </div>
                                    </template>

                                    <template x-if="day.active">
                                        <div class="space-y-4">
                                            <template x-for="meal in day.meals" :key="meal.id">
                                                <div class="bg-white rounded-xl border border-slate-200 shadow-sm hover:border-brand/30 transition overflow-hidden flex flex-col justify-between">
                                                    <div class="relative h-32 w-full bg-slate-100 overflow-hidden group">
                                                        <template x-if="meal.image">
                                                            <img :src="meal.image" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="Gericht">
                                                        </template>
                                                        <template x-if="!meal.image">
                                                            <div class="w-full h-full bg-gradient-to-br from-brand/10 to-brand-sage/20 flex flex-col items-center justify-center text-brand-dark p-2 text-center">
                                                                <i class="fa-solid fa-utensils text-2xl mb-1 opacity-30"></i>
                                                            </div>
                                                        </template>
                                                        <div class="absolute top-2 right-2 bg-brand-dark/80 text-white text-xs font-bold px-2 py-0.5 rounded-md shadow backdrop-blur-sm">
                                                            <span x-text="formatPrice(meal.price)"></span>
                                                        </div>
                                                    </div>

                                                    <div class="p-3 space-y-2 flex-1">
                                                        <h3 class="font-bold text-xs sm:text-sm text-slate-900 leading-snug" x-text="meal.title"></h3>
                                                        <p class="text-xs text-slate-500 line-clamp-2" x-text="meal.description"></p>
                                                    </div>

                                                    <div class="p-3 bg-slate-50 border-t border-slate-100 no-print space-y-2">
                                                        <template x-if="currentUser.role === 'user'">
                                                            <div>
                                                                <template x-if="hasBooking(day.id, meal.id)">
                                                                    <div class="p-2 bg-emerald-50 border border-emerald-200 rounded-lg text-xs text-emerald-800 flex items-center justify-between font-semibold">
                                                                        <span><i class="fa-solid fa-circle-check text-emerald-600"></i> Gebucht</span>
                                                                        <button @click="cancelBooking(day.id, meal.id)" :disabled="isSelectedWeekDeadlinePassed()" class="text-rose-600 hover:underline text-[11px] disabled:opacity-50">Stornieren</button>
                                                                    </div>
                                                                </template>

                                                                <template x-if="!hasBooking(day.id, meal.id)">
                                                                    <button @click="bookMeal(day.id, meal.id)" :disabled="isSelectedWeekDeadlinePassed()" class="w-full py-1.5 bg-brand hover:bg-brand-dark disabled:bg-slate-300 text-white text-xs font-bold rounded-lg transition">Bestellen</button>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

            </div>
        </template>
    </main>

    <!-- FIREBASE INTEGRATION SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        // Firebase-Konfiguration
        const firebaseConfig = {
            apiKey: "AIzaSyCQ9dgmpM79KmQTy_fhIF33VY-PHnV7KrE",
            authDomain: "test-mittagessen.firebaseapp.com",
            projectId: "test-mittagessen",
            storageBucket: "test-mittagessen.firebasestorage.app",
            messagingSenderId: "205814368618",
            appId: "1:205814368618:web:5ef3a7ffa50a1c2c2a7d13"
        };

        // App & Services initialisieren
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Alpine.js Logik einbinden
        window.lunchVoteApp = function() {
            return {
                currentUser: null,
                activeTab: 'menu',
                loginForm: { email: '', password: '' },
                loginError: '',
                toast: { visible: false, message: '', type: 'info' },

                currentWeekMonday: '',
                selectedWeekMonday: '',
                settings: { cutoffDay: '4', cutoffTime: '12:00' },

                menusByWeek: {},
                bookings: [],

                initApp() {
                    const todayMonday = this.getMondayOfDate(new Date());
                    this.currentWeekMonday = this.formatISODate(todayMonday);
                    this.selectedWeekMonday = this.currentWeekMonday;

                    // Firebase Auth State Listener
                    onAuthStateChanged(auth, async (user) => {
                        if (user) {
                            const userDoc = await getDoc(doc(db, "users", user.uid));
                            if (userDoc.exists()) {
                                this.currentUser = { id: user.uid, ...userDoc.data() };
                                this.listenToData();
                            } else {
                                this.currentUser = { id: user.uid, email: user.email, name: user.email.split('@')[0], role: 'user' };
                            }
                        } else {
                            this.currentUser = null;
                        }
                    });
                },

                listenToData() {
                    // Firestore Speiseplan Listener für ausgewählte Woche
                    onSnapshot(doc(db, "menus", this.selectedWeekMonday), (docSnap) => {
                        if (docSnap.exists()) {
                            this.menusByWeek[this.selectedWeekMonday] = docSnap.data().days;
                        } else {
                            this.ensureMenuPlanForWeek(this.selectedWeekMonday);
                        }
                    });

                    // Firestore Buchungs-Listener
                    const q = query(collection(db, "bookings"), where("weekKey", "==", this.selectedWeekMonday));
                    onSnapshot(q, (snapshot) => {
                        this.bookings = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    });
                },

                async login() {
                    this.loginError = '';
                    try {
                        await signInWithEmailAndPassword(auth, this.loginForm.email.trim(), this.loginForm.password);
                        this.notify('Erfolgreich angemeldet!', 'success');
                    } catch (err) {
                        this.loginError = 'Fehler beim Anmelden: ' + err.message;
                    }
                },

                async logout() {
                    await signOut(auth);
                    this.currentUser = null;
                    this.notify('Erfolgreich abgemeldet.', 'info');
                },

                async bookMeal(dayId, mealId) {
                    if (!this.currentUser) return;
                    const bookingId = `${this.currentUser.id}_${this.selectedWeekMonday}_${dayId}`;

                    await setDoc(doc(db, "bookings", bookingId), {
                        userId: this.currentUser.id,
                        weekKey: this.selectedWeekMonday,
                        dayId: dayId,
                        mealId: mealId,
                        timestamp: new Date().toISOString()
                    });

                    this.notify('Bestellung im System gespeichert!', 'success');
                },

                notify(msg, type = 'info') {
                    this.toast.message = msg;
                    this.toast.type = type;
                    this.toast.visible = true;
                    setTimeout(() => { this.toast.visible = false; }, 3500);
                },

                getMondayOfDate(d) {
                    const date = new Date(d);
                    const day = date.getDay();
                    const diff = date.getDate() - day + (day === 0 ? -6 : 1);
                    return new Date(date.setDate(diff));
                },

                formatISODate(d) {
                    return d.toISOString().split('T')[0];
                },

                addDaysToISO(isoString, days) {
                    const d = new Date(isoString);
                    d.setDate(d.getDate() + days);
                    return this.formatISODate(d);
                },

                ensureMenuPlanForWeek(mondayISO) {
                    if (!this.menusByWeek[mondayISO]) {
                        this.menusByWeek[mondayISO] = [
                            { id: 'mon', dayName: 'Montag', date: this.addDaysToISO(mondayISO, 0), active: true, meals: [] },
                            { id: 'tue', dayName: 'Dienstag', date: this.addDaysToISO(mondayISO, 1), active: true, meals: [] },
                            { id: 'wed', dayName: 'Mittwoch', date: this.addDaysToISO(mondayISO, 2), active: true, meals: [] },
                            { id: 'thu', dayName: 'Donnerstag', date: this.addDaysToISO(mondayISO, 3), active: true, meals: [] },
                            { id: 'fri', dayName: 'Freitag', date: this.addDaysToISO(mondayISO, 4), active: true, meals: [] }
                        ];
                    }
                },

                getCurrentMenuPlan() {
                    this.ensureMenuPlanForWeek(this.selectedWeekMonday);
                    return this.menusByWeek[this.selectedWeekMonday];
                },

                hasBooking(dayId, mealId) {
                    return this.bookings.some(b => b.userId === this.currentUser?.id && b.dayId === dayId && b.mealId === mealId);
                },

                getWeekDisplayTitle() { return `Woche ab ${this.selectedWeekMonday}`; },
                getWeekStatus() { return this.selectedWeekMonday === this.currentWeekMonday ? 'current' : 'future'; },
                getWeekStatusText() { return this.getWeekStatus() === 'current' ? 'Aktuelle Woche' : 'Andere Woche'; },
                isSelectedWeekDeadlinePassed() { return false; },
                getDeadlineTextForSelectedWeek() { return 'Offen'; },
                formatGermanDate(iso) { return iso; },
                formatPrice(p) { return (p || 0).toFixed(2) + ' €'; },
                isToday(iso) { return iso === this.currentWeekMonday; },
                navigateWeek(n) {
                    const d = new Date(this.selectedWeekMonday);
                    d.setDate(d.getDate() + (n * 7));
                    this.selectedWeekMonday = this.formatISODate(d);
                    this.listenToData();
                },
                jumpToToday() {
                    this.selectedWeekMonday = this.currentWeekMonday;
                    this.listenToData();
                }
            }
        };
    </script>
</body>
</html>
